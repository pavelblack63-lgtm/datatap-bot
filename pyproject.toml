[project]
name = "datatap-bot"
version = "0.1.0"
description = "DataTap - Telegram Clicker Game"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.4.1",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "aiosqlite==0.20.0",
    "aioredis==2.0.1",
    "pydantic-settings==2.3.4",
    "structlog==24.1.0",
    "python-dotenv==1.0.1",
    "aiohttp==3.9.5",
    "alembic==1.13.1",
    "bcrypt>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "ruff==0.3.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"